<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>İlaç Takip Paneli</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d1117">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent-color: #238636;
            --accent-hover: #2ea043;
            --morning-color: #d29922;
            --night-color: #1f6feb;
            --noon-color: #f85149;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 10px;
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding: 2px 4px;
        }

        h1 {
            font-size: 1.15rem;
            font-weight: 600;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 8px;
        }

        .stat-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px;
            text-align: center;
        }

        .stat-value {
            font-size: 1rem;
            font-weight: bold;
            margin-top: 1px;
        }

        .stat-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .search-filter-container {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }

        #search-input {
            flex: 1;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 7px 10px;
            color: var(--text-primary);
            font-size: 0.85rem;
        }

        #search-input:focus {
            outline: none;
            border-color: var(--night-color);
        }

        .medicine-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-bottom: 16px;
        }

        .medicine-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 6px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .medicine-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .medicine-svg {
            width: 54px;
            height: 36px;
            flex-shrink: 0;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            border: 1px solid #d0d7de;
            overflow: hidden;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .medicine-svg svg {
            width: 100%;
            height: 100%;
        }

        .medicine-details {
            display: flex;
            flex-direction: column;
            gap: 1px;
            min-width: 0;
        }

        .medicine-name {
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .medicine-time {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .actions {
            display: flex;
            gap: 5px;
            align-items: center;
            flex-shrink: 0;
        }

        .btn-check {
            background-color: #21262d;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 5px 8px;
            border-radius: 5px;
            font-size: 0.7rem;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            white-space: nowrap;
            min-width: 72px;
        }

        .btn-check.morning {
            border-color: var(--morning-color);
            color: var(--morning-color);
        }

        .btn-check.morning.checked {
            background-color: var(--morning-color);
            color: #000;
        }

        .btn-check.noon {
            border-color: var(--noon-color);
            color: var(--noon-color);
        }

        .btn-check.noon.checked {
            background-color: var(--noon-color);
            color: #fff;
        }

        .btn-check.night {
            border-color: var(--night-color);
            color: var(--night-color);
        }

        .btn-check.night.checked {
            background-color: var(--night-color);
            color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <h1>İlaç Takip Paneli</h1>
        <button onclick="resetAll()" style="background:none; border:none; color:var(--text-secondary); cursor:pointer; font-size:1.1rem;" title="Sıfırla">🔄</button>
    </header>

    <div class="stats-container">
        <div class="stat-card">
            <div class="stat-label">Toplam Doz</div>
            <div class="stat-value" id="total-count">14</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Alınan</div>
            <div class="stat-value" id="completed-count" style="color: var(--accent-hover);">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">İlerleme</div>
            <div class="stat-value" id="progress-percent">%0</div>
        </div>
    </div>

    <div class="search-filter-container">
        <input type="text" id="search-input" placeholder="İlaç ara..." oninput="filterMedicines()">
    </div>

    <div class="medicine-list" id="medicine-list"></div>

    <script>
        const medicines = [
            { 
                id: 'm1', name: 'Augmentin', type: 'twice', 
                btn1: { label: 'Sabah 10:00', cls: 'morning', key: 'morning' }, 
                btn2: { label: 'Gece 22:00', cls: 'night', key: 'night' }, 
                times: ['Sabah 10:00', 'Gece 22:00'], 
                svg: `<svg viewBox="0 0 70 46" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="70" height="46" fill="white"/>
                    <rect y="8" width="70" height="12" fill="#6B21A8"/>
                    <text x="6" y="17" fill="white" font-size="7" font-weight="bold" font-family="sans-serif">AUGMENTIN</text>
                    <text x="6" y="32" fill="#4C1D95" font-size="5" font-weight="bold" font-family="sans-serif">BID 1000 mg</text>
                    <line x1="6" y1="38" x2="64" y2="38" stroke="#E5E7EB" stroke-width="1"/>
                </svg>` 
            },
            { 
                id: 'm2', name: 'Mucomax', type: 'twice', 
                btn1: { label: 'Sabah 10:00', cls: 'morning', key: 'morning' }, 
                btn2: { label: 'Gece 22:00', cls: 'night', key: 'night' }, 
                times: ['Sabah 10:00', 'Gece 22:00'], 
                svg: `<svg viewBox="0 0 70 46" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="70" height="46" fill="white"/>
                    <path d="M0 24C15 20 30 28 45 24C55 21 65 25 70 24V46H0V24Z" fill="#0284C7"/>
                    <text x="6" y="15" fill="#0369A1" font-size="7" font-weight="bold" font-family="sans-serif">Mucomax</text>
                    <text x="6" y="21" fill="#64748B" font-size="4" font-family="sans-serif">600 mg Efervesan</text>
                </svg>` 
            },
            { 
                id: 'm3', name: 'Majezik', type: 'twice', 
                btn1: { label: 'Sabah 10:00', cls: 'morning', key: 'morning' }, 
                btn2: { label: 'Gece 22:00', cls: 'night', key: 'night' }, 
                times: ['Sabah 10:00', 'Gece 22:00'], 
                svg: `<svg viewBox="0 0 70 46" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="70" height="46" fill="white"/>
                    <path d="M70 46L30 46L70 15V46Z" fill="#2563EB"/>
                    <text x="6" y="16" fill="#1E40AF" font-size="7" font-weight="bold" font-family="sans-serif">Majezik</text>
                    <text x="6" y="23" fill="#DC2626" font-size="4" font-weight="bold" font-family="sans-serif">100 mg Film Tablet</text>
                </svg>` 
            },
            { 
                id: 'm4', name: 'Ayra Plus', type: 'single', 
                btn1: { label: 'Öğle 13:00', cls: 'noon', key: 'dose' }, 
                times: ['Öğle 13:00'], 
                svg: `<svg viewBox="0 0 70 46" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="70" height="46" fill="white"/>
                    <line x1="6" y1="18" x2="35" y2="18" stroke="#DC2626" stroke-width="2"/>
                    <text x="38" y="20" fill="#1E293B" font-size="5" font-weight="bold" font-family="sans-serif">PLUS</text>
                    <text x="6" y="14" fill="#DC2626" font-size="7" font-weight="bold" font-family="sans-serif">AYRA</text>
                    <path d="M70 46L40 46L70 25V46Z" fill="#1D4ED8"/>
                </svg>` 
            },
            { 
                id: 'm5', name: 'Lustral', type: 'single', 
                btn1: { label: 'Öğle 13:00', cls: 'noon', key: 'dose' }, 
                times: ['Öğle 13:00'], 
                svg: `<svg viewBox="0 0 70 46" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="70" height="46" fill="white"/>
                    <rect x="0" y="0" width="18" height="46" fill="#0284C7"/>
                    <text x="22" y="18" fill="#0F172A" font-size="7" font-weight="bold" font-family="sans-serif">Lustral</text>
                    <text x="50" y="18" fill="#DC2626" font-size="5" font-weight="bold" font-family="sans-serif">50 mg</text>
                    <text x="22" y="30" fill="#64748B" font-size="4" font-family="sans-serif">Sertralin</text>
                </svg>` 
            },
            { 
                id: 'm6', name: 'Ultrox', type: 'single', 
                btn1: { label: 'Gece 00:00', cls: 'night', key: 'dose' }, 
                times: ['Gece 00:00'], 
                svg: `<svg viewBox="0 0 70 46" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="70" height="46" fill="white"/>
                    <rect x="6" y="12" width="58" height="4" fill="#DC2626"/>
                    <rect x="6" y="20" width="40" height="4" fill="#D97706"/>
                    <text x="6" y="34" fill="#0F172A" font-size="7" font-weight="bold" font-family="sans-serif">Ultrox</text>
                </svg>` 
            },
            { 
                id: 'm7', name: 'Ecopirin Pro', type: 'single', 
                btn1: { label: 'Gece 00:00', cls: 'night', key: 'dose' }, 
                times: ['Gece 00:00'], 
                svg: `<svg viewBox="0 0 70 46" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="70" height="46" fill="white"/>
                    <rect x="0" y="10" width="70" height="14" fill="#0284C7"/>
                    <text x="6" y="20" fill="white" font-size="6" font-weight="bold" font-family="sans-serif">Ecopirin</text>
                    <text x="42" y="20" fill="#FDE047" font-size="5" font-weight="bold" font-family="sans-serif">Pro</text>
                    <rect x="0" y="28" width="70" height="4" fill="#D97706"/>
                </svg>` 
            },
            { 
                id: 'm8', name: 'Benexol B12', type: 'single', 
                btn1: { label: 'Gece 00:00', cls: 'night', key: 'dose' }, 
                times: ['Gece 00:00'], 
                svg: `<svg viewBox="0 0 70 46" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="70" height="46" fill="white"/>
                    <path d="M0 16C25 8 45 24 70 16V22C45 30 25 14 0 22V16Z" fill="#0284C7"/>
                    <text x="6" y="34" fill="#0369A1" font-size="6" font-weight="bold" font-family="sans-serif">Benexol</text>
                    <text x="38" y="34" fill="#0284C7" font-size="5" font-family="sans-serif">B12</text>
                    <circle cx="60" cy="32" r="3" stroke="#0284C7" stroke-width="1"/>
                </svg>` 
            },
            { 
                id: 'm9', name: 'Probest', type: 'single', 
                btn1: { label: 'Gece 00:00', cls: 'night', key: 'dose' }, 
                times: ['Gece 00:00'], 
                svg: `<svg viewBox="0 0 70 46" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="70" height="46" fill="#0F172A"/>
                    <rect x="25" y="8" width="20" height="30" rx="3" fill="#16A34A"/>
                    <rect x="27" y="10" width="16" height="8" fill="white"/>
                    <text x="35" y="16" fill="#16A34A" font-size="4" font-weight="bold" text-anchor="middle" font-family="sans-serif">Probest</text>
                </svg>` 
            },
            { 
                id: 'm10', name: 'Parol', type: 'single', 
                btn1: { label: 'Gerektiğinde', cls: 'morning', key: 'dose' }, 
                times: ['Gerektiğinde'], 
                svg: `<svg viewBox="0 0 70 46" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="70" height="46" fill="white"/>
                    <rect x="0" y="6" width="70" height="4" fill="#E11D48"/>
                    <rect x="0" y="24" width="70" height="12" fill="#0284C7"/>
                    <text x="6" y="33" fill="white" font-size="7" font-weight="bold" font-family="sans-serif">Parol</text>
                    <text x="6" y="18" fill="#475569" font-size="4" font-family="sans-serif">500 mg Tablet</text>
                </svg>` 
            },
            { 
                id: 'm11', name: 'Diafuryl Fort', type: 'single', 
                btn1: { label: 'Gerektiğinde', cls: 'morning', key: 'dose' }, 
                times: ['Gerektiğinde'], 
                svg: `<svg viewBox="0 0 70 46" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="70" height="46" fill="white"/>
                    <rect x="0" y="6" width="70" height="6" fill="#16A34A"/>
                    <rect x="0" y="34" width="70" height="6" fill="#0284C7"/>
                    <text x="6" y="24" fill="#15803D" font-size="6" font-weight="bold" font-family="sans-serif">Diafuryl</text>
                    <text x="36" y="24" fill="#1E3A8A" font-size="5" font-weight="bold" font-family="sans-serif">Fort</text>
                </svg>` 
            }
        ];

        let state = JSON.parse(localStorage.getItem('ilac_state_v3')) || {};

        function renderList(filteredMedicines = medicines) {
            const listEl = document.getElementById('medicine-list');
            listEl.innerHTML = '';

            filteredMedicines.forEach(med => {
                const card = document.createElement('div');
                card.className = 'medicine-card';

                let actionsHTML = '';
                if (med.type === 'twice') {
                    const k1 = `${med.id}_${med.btn1.key}`;
                    const k2 = `${med.id}_${med.btn2.key}`;
                    const c1 = state[k1] ? 'checked' : '';
                    const c2 = state[k2] ? 'checked' : '';
                    
                    actionsHTML = `
                        <div class="actions">
                            <button class="btn-check ${med.btn1.cls} ${c1}" onclick="toggleDose('${k1}')">${med.btn1.label}</button>
                            <button class="btn-check ${med.btn2.cls} ${c2}" onclick="toggleDose('${k2}')">${med.btn2.label}</button>
                        </div>
                    `;
                } else {
                    const k1 = `${med.id}_single`;
                    const c1 = state[k1] ? 'checked' : '';
                    
                    actionsHTML = `
                        <div class="actions">
                            <button class="btn-check ${med.btn1.cls} ${c1}" onclick="toggleDose('${k1}')">${med.btn1.label}</button>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="medicine-info">
                        <div class="medicine-svg">${med.svg}</div>
                        <div class="medicine-details">
                            <span class="medicine-name">${med.name}</span>
                            <span class="medicine-time">${med.times.join(' / ')}</span>
                        </div>
                    </div>
                    ${actionsHTML}
                `;
                
                listEl.appendChild(card);
            });

            updateStats();
        }

        function toggleDose(key) {
            state[key] = !state[key];
            localStorage.setItem('ilac_state_v3', JSON.stringify(state));
            renderList(getFilteredMedicines());
        }

        function getFilteredMedicines() {
            const query = document.getElementById('search-input').value.toLowerCase();
            return medicines.filter(m => m.name.toLowerCase().includes(query));
        }

        function filterMedicines() {
            renderList(getFilteredMedicines());
        }

        function updateStats() {
            let totalDoses = 0;
            let completedDoses = 0;

            medicines.forEach(med => {
                if (med.type === 'twice') {
                    totalDoses += 2;
                    if (state[`${med.id}_morning`]) completedDoses++;
                    if (state[`${med.id}_night`]) completedDoses++;
                } else {
                    totalDoses += 1;
                    if (state[`${med.id}_single`]) completedDoses++;
                }
            });

            document.getElementById('total-count').innerText = totalDoses;
            document.getElementById('completed-count').innerText = completedDoses;
            
            const percent = totalDoses > 0 ? Math.round((completedDoses / totalDoses) * 100) : 0;
            document.getElementById('progress-percent').innerText = `%${percent}`;
        }

        function resetAll() {
            if(confirm('Tüm günün işaretlerini sıfırlamak istiyor musunuz?')) {
                state = {};
                localStorage.removeItem('ilac_state_v3');
                renderList();
            }
        }

        renderList();
    </script>
</body>
</html>
